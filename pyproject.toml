[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamicsbench"
version = "0.1.0"
description = "Validation and execution evidence for differentiable dynamical models"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Yixuan Zheng"}]
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy>=1.26"]

[project.scripts]
dynamicsbench = "dynamicsbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
independent = ["torchdiffeq==0.2.5"]

[project.urls]
Repository = "https://github.com/yixuan-zheng/DynamicsBench"
Issues = "https://github.com/yixuan-zheng/DynamicsBench/issues"
